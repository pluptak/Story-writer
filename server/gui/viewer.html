<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>story-writer — run viewer</title>

<link rel="stylesheet" type="text/css" href="viewer.css">

<!-- Before anything paints, or a kept theme arrives as a flash of the other one. -->
<script>try { const t = localStorage.getItem("sw-theme");
  if (t) document.documentElement.setAttribute("data-theme", t); } catch {}</script>

<div class="topbar">
  <div class="brand"><h1 id="title">story-writer</h1><div class="q" id="question"></div></div>
  <button class="btn" id="expand" title="expand or collapse every block" aria-pressed="false">expand all</button>
  <button class="btn" id="theme" title="switch colour theme" aria-pressed="false">theme</button>
</div>
<div class="ribbon" id="ribbon" hidden></div>
<div class="srcbar" data-tid="chrome.srcbar"><span class="dot" id="dot"></span><span id="src">nothing loaded</span><span id="where"></span>
  <span class="provchip" id="provchip" data-tid="chrome.provider" hidden></span>
  <span id="notice" role="status"></span></div>
<div class="timeline" id="timeline" data-tid="chrome.timeline" hidden></div>

<div class="layout">
  <nav class="sidenav" id="sidenav" data-tid="chrome.sidenav" aria-label="sections">
    <div class="navgroup" id="navgroup-stories">
      <h3>Stories</h3>
      <button class="navitem" id="nav-shelf" data-view="shelf" data-tid="chrome.navitem" title="browse and choose a story">My stories</button>
      <button class="navitem" id="nav-new" data-view="scaffold" data-tid="chrome.navitem" title="build a new story with the architect">+ New story</button>
    </div>
    <div class="navgroup" id="navgroup-workspace">
      <h3>Workspace</h3>
      <button class="navitem" id="nav-architect" data-view="scaffold" data-tid="chrome.navitem" title="the architect">Architect</button>
      <button class="navitem" id="nav-story" data-view="story" data-tid="chrome.navitem" title="this story's scenes and chapters">Story map</button>
      <button class="navitem" id="nav-live" data-view="live" data-tid="chrome.navitem" title="the scene being written now">Write<span class="tabasked" id="tabasked" hidden>· asked</span><span class="tabdot" id="tabdot" hidden></span></button>
      <button class="navitem" id="nav-readstory" data-view="readstory" data-tid="chrome.navitem" title="the accepted prose">Manuscript</button>
      <button class="navitem" id="nav-read" data-view="read" data-tid="chrome.navitem" title="a saved run, read-only">Saved runs</button>
    </div>
    <div class="navgroup" id="navgroup-libraries">
      <h3>Libraries</h3>
      <button class="navitem" id="nav-cat-characters" data-view="catalog" data-kind="characters" data-tid="chrome.navitem">Characters</button>
      <button class="navitem" id="nav-cat-styles" data-view="catalog" data-kind="styles" data-tid="chrome.navitem">Styles</button>
      <button class="navitem" id="nav-cat-tags" data-view="catalog" data-kind="tags" data-tid="chrome.navitem">Tags</button>
      <button class="navitem" id="nav-cat-skills" data-view="catalog" data-kind="skills" data-tid="chrome.navitem">Skill Bible</button>
    </div>
  </nav>
  <main class="page" id="page"></main>
  <aside class="rail" id="rail">
    <section class="side" id="runctrl" data-tid="chrome.runctrl">
      <h3>run controls</h3>
      <div id="railstats"></div>
      <div class="sessionbar" id="sessionbar" hidden>
        <select class="btn" id="modelSelect" title="override the model for the rest of this run"
                aria-label="override the model for the rest of this run"><option value="">story default</option></select>
        <button class="btn" id="interactive" title="toggle whether the run stops to ask you">interactive</button>
        <button class="btn" id="pause" hidden title="pause or resume at the next step boundary">pause</button>
        <button class="btn" id="consultMe" hidden title="answer the next consult yourself">consult me</button>
        <button class="btn" id="stop" hidden title="end the scene early — click twice to confirm">stop run</button>
        <span class="ctrl-err" id="sessionNotice" role="status"></span>
      </div>
    </section>
    <section class="side" id="castcard" hidden>
      <h3>cast in scene</h3>
      <div class="cast" id="cast"></div>
    </section>
  </aside>
</div>
<div id="modalroot"></div>

<div class="drop" id="drop">drop a writing-log.jsonl</div>
<div class="prompt" id="prompt" data-tid="chrome.budget-prompt">
  <span id="promptText">The step budget is spent.</span>
  <input id="promptN" type="number" min="0" value="8" aria-label="how many more steps to allow">
  <button class="btn" id="promptGo">give steps</button>
  <button class="btn" id="promptStop">stop</button>
</div>
<input type="file" id="file" accept=".jsonl,.json,.txt" style="display:none">

<script type="module" src="viewer.js"></script>
