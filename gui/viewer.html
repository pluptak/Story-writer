<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>story-writer — run viewer</title>
<!--
  Renderer for the story-writer engine (see ../GUI-SPEC.md). A run is shown PROSE FIRST: the scene
  reads straight down the page, and every consult that produced it sits collapsed between the
  paragraphs it came between. Open one to see exactly what that character was told, what it asked
  back, what it answered, and whether the writer took it.

  Two ways in:
    • LIVE   — engine run with `--serve`; this file is served at / and streams from /events.
               Late joiners get the whole run replayed, then live.
    • REPLAY — drop a saved out/writing-log.jsonl on the page, or ?src=URL. Over http the current
               run's log is at /log.jsonl and loads automatically.

  Dependency-free, no build step. Everything below is one file on purpose.
-->
<style>
  :root {
    --bg:#eceff4; --panel:#fff; --panel-2:#f4f6fa; --ink:#161b22; --muted:#5b6675; --faint:#8a94a3;
    --line:#dbe1ea; --accent:#0d6f8b; --warn:#a2650c; --bad:#b03a30; --good:#2c7a4b;
    --shadow:0 1px 2px rgba(20,32,52,.05),0 6px 20px rgba(20,32,52,.06);
    --sans: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --serif: Georgia,"Iowan Old Style","Palatino Linotype",ui-serif,serif;
    --mono: ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --panel:#151b24; --panel-2:#11161e; --ink:#dfe6f0; --muted:#8b97a8; --faint:#6a7686;
      --line:#242c38; --accent:#4fc3dd; --warn:#e0a84a; --bad:#ef7a6e; --good:#5fce87;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.35); }
  }
  :root[data-theme="dark"]{ --bg:#0d1117;--panel:#151b24;--panel-2:#11161e;--ink:#dfe6f0;--muted:#8b97a8;--faint:#6a7686;
    --line:#242c38;--accent:#4fc3dd;--warn:#e0a84a;--bad:#ef7a6e;--good:#5fce87;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.35); }
  :root[data-theme="light"]{ --bg:#eceff4;--panel:#fff;--panel-2:#f4f6fa;--ink:#161b22;--muted:#5b6675;--faint:#8a94a3;
    --line:#dbe1ea;--accent:#0d6f8b;--warn:#a2650c;--bad:#b03a30;--good:#2c7a4b;
    --shadow:0 1px 2px rgba(20,32,52,.05),0 6px 20px rgba(20,32,52,.06); }

  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.5;
         -webkit-font-smoothing:antialiased; }

  .topbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; padding:10px 20px;
            border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:8; }
  .brand { margin-right:auto; min-width:0; }
  .brand h1 { font-size:15px; margin:0; font-weight:600; }
  .brand .q { font-size:12px; color:var(--muted); margin-top:1px; }
  .cast { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { font-family:var(--mono); font-size:11px; padding:3px 9px; border-radius:999px;
          border:1px solid var(--line); background:var(--panel-2); white-space:nowrap; }
  .chip b { font-weight:600; }
  .chip .no { color:var(--bad); }
  .chip .yes { color:var(--good); }
  .btn { font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em;
         color:var(--muted); background:var(--panel-2); border:1px solid var(--line);
         padding:6px 10px; border-radius:8px; cursor:pointer; }
  .btn:hover { color:var(--ink); border-color:var(--accent); }
  .btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .btn[disabled] { opacity:.4; cursor:default; }
  .btn[disabled]:hover { color:var(--muted); border-color:var(--line); }
  .btn[hidden] { display:none; }
  /* armed: the second click is the one that ends a scene, so it has to look different from the first */
  .btn.armed { color:var(--bad); border-color:var(--bad); }
  .btn.armed:hover { color:var(--bad); border-color:var(--bad); }

  .srcbar { display:flex; align-items:center; gap:8px; padding:6px 20px; border-bottom:1px solid var(--line);
            background:var(--panel-2); font-family:var(--mono); font-size:11px; color:var(--muted); }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--good); }
  .dot.live { background:var(--accent); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  .layout { display:grid; grid-template-columns:minmax(0,1fr) 260px; align-items:start; }
  @media (max-width: 900px) { .layout { grid-template-columns:1fr; } .rail { display:none; } }

  .page { padding:28px clamp(16px,4vw,40px) 140px; max-width:730px; margin:0 auto; width:100%; }
  .prose { font-family:var(--serif); font-size:17.5px; line-height:1.66; }
  .prose p { margin:0 0 1.05em; }
  .prose p:last-child { margin-bottom:0; }
  .piece { margin:0 0 6px; }
  .piece.salvaged { border-left:2px solid var(--warn); padding-left:14px; margin-left:-16px; }
  .piece .salvnote { font-family:var(--mono); font-size:10px; color:var(--warn); text-transform:uppercase;
                     letter-spacing:.08em; margin-bottom:6px; }

  /* a consult, collapsed: a rule across the page with a label sitting on it */
  .consult { margin:18px 0 22px; }
  .consult > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px;
                       font-family:var(--mono); font-size:11px; color:var(--faint); }
  .consult > summary::-webkit-details-marker { display:none; }
  .consult > summary::after { content:""; flex:1; height:1px; background:var(--line); }
  .consult > summary:hover { color:var(--ink); }
  .consult > summary .who { color:var(--accent); font-weight:600; letter-spacing:.04em; }
  .consult > summary .qs { color:var(--muted); font-family:var(--sans); font-size:12px;
                           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:46%; }
  .consult[open] > summary { margin-bottom:10px; }
  .consult .tag { font-size:10px; padding:1px 6px; border-radius:999px; border:1px solid var(--line); }
  .consult .tag.retry { color:var(--warn); border-color:var(--warn); }
  .consult .tag.flag  { color:var(--bad);  border-color:var(--bad); }
  .consult .tag.asked { color:var(--accent); border-color:var(--accent); }

  .body { background:var(--panel); border:1px solid var(--line); border-radius:12px;
          padding:14px 16px; box-shadow:var(--shadow); font-size:13.5px; }
  .attempt + .attempt { margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); }
  .attempt h4 { margin:0 0 8px; font-family:var(--mono); font-size:10px; letter-spacing:.1em;
                text-transform:uppercase; color:var(--faint); font-weight:600; }
  .kv { margin:0 0 9px; }
  .kv .k { font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase;
           color:var(--faint); display:block; margin-bottom:2px; }
  .kv .v { color:var(--ink); }
  .kv.dim .v { color:var(--muted); }
  .qa { border-left:2px solid var(--accent); padding-left:11px; margin:0 0 9px; }
  .qa .ask { color:var(--ink); } .qa .ans { color:var(--muted); margin-top:2px; }
  .ansblock { background:var(--panel-2); border-radius:9px; padding:10px 12px; margin-top:9px; }
  .ansblock .speech { font-family:var(--serif); font-size:15px; }
  .ansblock .action { color:var(--muted); margin-top:4px; }
  .ansblock .thought { color:var(--faint); font-style:italic; margin-top:4px; }
  .skills { margin-top:8px; font-family:var(--mono); font-size:10.5px; color:var(--faint); }
  .skills .bad { color:var(--bad); }
  .verdict { margin-top:9px; font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; }
  .verdict.accept { color:var(--good); } .verdict.retry { color:var(--warn); }

  .note { font-family:var(--mono); font-size:11px; color:var(--muted); text-align:center;
          margin:22px 0; letter-spacing:.03em; }
  .note.end { color:var(--accent); }

  .rail { position:sticky; top:52px; padding:24px 20px; font-size:12px; }
  .rail h3 { font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
             color:var(--faint); margin:0 0 10px; font-weight:600; }
  .stat { display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px solid var(--line); }
  .stat .n { font-family:var(--mono); color:var(--ink); }
  .stat .n.warn { color:var(--warn); } .stat .n.bad { color:var(--bad); }
  .bar { height:4px; background:var(--line); border-radius:999px; overflow:hidden; margin:10px 0 16px; }
  .bar > i { display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .3s; }
  .composing { margin-top:18px; font-family:var(--mono); font-size:11px; color:var(--accent); }
  .composing .who { font-weight:600; }
  .composing i { display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--accent);
                 margin-right:5px; animation:pulse 1.2s ease-in-out infinite; }

  /* a reader consult: the writer stopped to ask you which way the scene goes */
  .reader { background:var(--panel); border:1px solid var(--accent); border-radius:12px;
            padding:14px 16px; box-shadow:var(--shadow); margin:18px 0; font-size:13.5px; }
  .reader.answered { border-color:var(--line); }
  .reader .rlabel { font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase;
                    color:var(--accent); margin-bottom:6px; }
  .reader.answered .rlabel { color:var(--faint); }
  .reader .rframing { font-family:var(--serif); font-size:15px; margin-bottom:12px; }
  .reader .rchosen { font-size:13px; color:var(--muted); }
  .reader .rchosen b { color:var(--ink); font-weight:600; }
  .reader .btns { flex-direction:column; align-items:stretch; }
  .reader .readerOpt { text-align:left; white-space:normal; }

  /* the picker: a panel at the TOP of the reading column, never a replacement for it. A session
     that has just finished a scene must not have that scene shoved off the page by the question
     of what to write next. */
  .picker { margin:0 0 34px; }
  .picker h2 { font-family:var(--serif); font-weight:400; font-size:21px; margin:0 0 3px; }
  .picker .sub { font-size:12.5px; color:var(--muted); margin:0 0 14px; }
  .cards { display:grid; gap:10px; }
  .card { display:block; width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer;
          background:var(--panel); border:1px solid var(--line); border-radius:12px;
          padding:13px 15px; box-shadow:var(--shadow); }
  .card:hover { border-color:var(--accent); }
  .card:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .card[disabled] { cursor:default; opacity:.75; }
  .card[disabled]:hover { border-color:var(--line); }
  .card .name { font-family:var(--mono); font-size:12.5px; font-weight:600; }
  .card .q { font-size:13.5px; margin:4px 0 0; }
  .card .pre { font-size:12.5px; color:var(--muted); margin:5px 0 0;
               display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .row { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:9px; }
  .card .meta { font-family:var(--mono); font-size:10.5px; color:var(--faint); margin-left:auto; }
  .card .bad  { color:var(--bad); font-size:12.5px; margin-top:5px; }
  .card .warn { color:var(--warn); font-size:11.5px; margin-top:4px; }
  .card.new { border-style:dashed; }
  .card.new .name { color:var(--good); }
  .card.new .q { color:var(--muted); }

  /* the interview: same slot as the picker, because it is the same question — what do we write? */
  .iv .lead { font-family:var(--serif); font-size:15.5px; margin:0 0 12px; color:var(--muted); }
  .iv .said { font-family:var(--mono); font-size:11px; color:var(--faint); margin:10px 0 0; }
  .iv .said.bad { color:var(--bad); } .iv .said.good { color:var(--good); }
  .iv .asked { border-left:2px solid var(--warn); padding-left:12px; margin:14px 0 0; }
  .iv .asked .k { font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase;
                  color:var(--warn); display:block; margin-bottom:3px; }
  .iv .prob { color:var(--warn); font-size:12.5px; margin-top:5px; }
  .iv .note { text-align:left; margin:10px 0 0; }

  .proposal { background:var(--panel); border:1px solid var(--line); border-radius:12px;
              padding:15px 17px; box-shadow:var(--shadow); margin-top:14px; }
  .proposal h3 { font-family:var(--serif); font-weight:400; font-size:19px; margin:0 0 2px; }
  .proposal .where { font-family:var(--mono); font-size:10.5px; color:var(--faint); margin-bottom:10px; }
  .proposal .premise { font-family:var(--serif); font-size:14.5px; line-height:1.6; margin:0 0 10px; white-space:pre-wrap; }
  .proposal .q { font-size:13.5px; margin:0 0 12px; }
  .proposal .q b { font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase;
                   color:var(--faint); display:block; }
  .who { border-top:1px solid var(--line); padding-top:11px; margin-top:11px; }
  .who .nm { font-family:var(--mono); font-size:12px; font-weight:600; color:var(--accent); }
  .who .line { font-size:12.5px; margin-top:3px; }
  .who .line .k { font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
                  color:var(--faint); margin-right:6px; }
  .who .line .yes { color:var(--good); } .who .line .no { color:var(--bad); }
  .who .persona { font-size:12.5px; color:var(--muted); margin-top:6px; white-space:pre-wrap; }
  .who .persona.clip { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  .field { display:flex; flex-direction:column; gap:9px; margin-top:14px; }
  .field label { font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase;
                 color:var(--faint); }
  .field textarea, .field input[type=text] {
    font-family:var(--sans); font-size:14px; line-height:1.5; color:var(--ink); width:100%;
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .field textarea { min-height:74px; resize:vertical; }
  .field textarea:focus, .field input[type=text]:focus { outline:none; border-color:var(--accent); }
  .field textarea[disabled], .field input[disabled] { opacity:.5; }
  .btns { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .btn.primary { color:var(--accent); border-color:var(--accent); }
  .btn.primary[disabled] { color:var(--muted); border-color:var(--line); }
  .thinking { font-family:var(--mono); font-size:11px; color:var(--accent); margin-top:14px; }
  .thinking i { display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--accent);
                margin-right:6px; animation:pulse 1.2s ease-in-out infinite; }

  .empty { max-width:520px; margin:12vh auto; text-align:center; color:var(--muted); }
  .empty h2 { font-family:var(--serif); font-weight:400; color:var(--ink); font-size:24px; margin:0 0 10px; }
  .empty code { font-family:var(--mono); font-size:12px; background:var(--panel-2); padding:2px 6px;
                border:1px solid var(--line); border-radius:5px; }
  .drop { position:fixed; inset:0; background:color-mix(in srgb,var(--accent) 14%,transparent);
          border:3px dashed var(--accent); display:none; place-items:center; z-index:20;
          font-family:var(--mono); color:var(--ink); }
  .drop.on { display:grid; }

  .prompt { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:12;
            background:var(--panel); border:1px solid var(--warn); border-radius:12px;
            padding:14px 16px; box-shadow:var(--shadow); display:none; align-items:center; gap:12px;
            font-size:13px; }
  .prompt.on { display:flex; }
  .prompt input { width:64px; font-family:var(--mono); font-size:13px; padding:5px 8px;
                  border:1px solid var(--line); border-radius:7px; background:var(--panel-2); color:var(--ink); }
</style>

<div class="topbar">
  <div class="brand"><h1 id="title">story-writer</h1><div class="q" id="question"></div></div>
  <div class="cast" id="cast"></div>
  <button class="btn" id="consultMe" hidden>consult me</button>
  <button class="btn" id="stop" hidden>stop run</button>
  <button class="btn" id="expand">expand all</button>
  <button class="btn" id="theme">theme</button>
  <button class="btn" id="load">load run</button>
</div>
<div class="srcbar"><span class="dot" id="dot"></span><span id="src">nothing loaded</span><span id="where"></span></div>

<div class="layout">
  <main class="page" id="page"></main>
  <aside class="rail" id="rail"></aside>
</div>

<div class="drop" id="drop">drop a writing-log.jsonl</div>
<div class="prompt" id="prompt">
  <span id="promptText">The step budget is spent.</span>
  <input id="promptN" type="number" min="0" value="8">
  <button class="btn" id="promptGo">give steps</button>
  <button class="btn" id="promptStop">stop</button>
</div>
<input type="file" id="file" accept=".jsonl,.json,.txt" style="display:none">

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  let events = [];            // every RunEvent seen, in seq order
  // /events REPLAYS the whole run before it attaches, and EventSource reconnects on its own after
  // any blip. Without this the replay appends a second copy of the scene, and the page grows one
  // whole scene per reconnect — which reads as "the story will not close".
  let seen = new Set();
  let meta = null;            // from /run, when serving
  let composing = null;       // ephemeral: {who, secs, chars}
  let session = { running:false, stopping:false, where:"", picking:false, armed:false };  // the process, not the story
  let armed = 0;              // timer id: the stop button is waiting for its confirming second click
  let stories = null;         // story cards from /stories, while the session waits for a choice
  let picked = "";            // a choice already sent; keeps a double-click from being two picks
  let scaffold = { active:false };   // the interview, from /scaffold and its SSE frames
  let ideaOpen = false;       // "new story…" clicked; no interview on the server yet
  let personasFull = false;
  let acceptArmed = 0;        // timer id: accepting over a complaint wants a second click
  // Re-render is whole, which would otherwise eat what you are typing mid-round. Drafts live out
  // here and are written back in; focus is read off the document as the render begins, rather than
  // tracked through focus/blur — removing a focused node does not reliably fire blur, and a click on
  // any button would clear a tracked value before the re-render it triggered.
  const draft = { idea:"", say:"", folder:"" };
  const FIELDS = /^f-(idea|say|folder)$/;
  const open = new Set();     // which consults are expanded, by seq — survives re-render
  let expandAll = false;

  // ---- grouping -----------------------------------------------------------
  // Events are flat and in order; the page is not. A consult and everything it produced (questions
  // back, repairs, retries, the answer, the verdict) becomes ONE foldable block sitting where it
  // happened. A retry arrives as another `consult` with attempt > 1, so it joins the block it
  // belongs to rather than starting a new one.
  function build() {
    const blocks = []; let cur = null;
    for (const e of events) {
      switch (e.t) {
        case "scene_start": if (!meta) meta = { story:e.story, target:e.target, characters:(e.characters||[]).map(n=>({name:n,skills:[],lacks:[]})) }; break;
        case "draft":
          if (e.prose) { blocks.push({ kind:"prose", seq:e.seq, text:e.prose, salvaged:!!e.salvaged }); }
          break;
        case "consult": {
          if (!cur || e.attempt === 1) { cur = { kind:"consult", seq:e.seq, who:e.character, attempts:[] }; blocks.push(cur); }
          cur.attempts.push({ n:e.attempt, situation:e.situation, question:e.question, wants:e.wants, qa:[], flags:[] });
          break;
        }
        case "clarify":   last(cur)?.qa.push({ q:e.question, a:e.answer }); break;
        case "forced":    last(cur)?.flags.push("answered without the detail it asked for"); break;
        case "repair":    last(cur)?.flags.push("re-asked: " + e.why); break;
        case "skill_flag":last(cur)?.flags.push("used what it cannot do: " + (e.unknown||[]).join(", ")); break;
        case "answer":    if (last(cur)) last(cur).answer = e; break;
        case "judge":     if (last(cur)) last(cur).judge = e; break;
        case "accept":    if (cur) { cur.accepted = e; cur = null; } break;
        case "budget":    blocks.push({ kind:"note", seq:e.seq, text:`+${e.added} steps (budget now ${e.budget})` }); break;
        case "reader_ask": blocks.push({ kind:"reader", seq:e.seq, framing:e.framing, options:e.options||[], answer:null }); break;
        case "reader_answer": {
          const rb = [...blocks].reverse().find(b => b.kind === "reader" && b.answer === null);
          if (rb) rb.answer = e.answer;
          break;
        }
        case "bad_consult": blocks.push({ kind:"note", seq:e.seq, text:`consult to ${e.character} not sent — ${e.why}` }); break;
        case "scene_end": blocks.push({ kind:"end", seq:e.seq, ...e }); break;
      }
    }
    return blocks;
  }
  const last = c => c && c.attempts[c.attempts.length - 1];

  // ---- rendering ----------------------------------------------------------
  const paras = t => String(t).split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("");

  function renderConsult(b) {
    const retried = b.attempts.length > 1;
    const flagged = b.attempts.some(a => a.flags.length);
    const asked   = b.attempts.some(a => a.qa.length);
    const isOpen  = expandAll || open.has(b.seq);
    const q = b.attempts[0]?.question || "";
    const tags = [
      asked   ? '<span class="tag asked">asked back</span>' : "",
      retried ? `<span class="tag retry">${b.attempts.length - 1} retry</span>` : "",
      flagged ? '<span class="tag flag">flagged</span>' : "",
    ].join("");

    const attempts = b.attempts.map((a, i) => {
      const ans = a.answer;
      return `<div class="attempt">
        <h4>${b.attempts.length > 1 ? `attempt ${a.n}${a.n > 1 ? " — fresh instance, no memory of the last" : ""}` : "asked"}</h4>
        <div class="kv dim"><span class="k">situation given</span><span class="v">${esc(a.situation)}</span></div>
        <div class="kv"><span class="k">question</span><span class="v">${esc(a.question)}</span></div>
        ${a.qa.map(x => `<div class="qa"><div class="ask">${esc(x.q)}</div><div class="ans">${esc(x.a)}</div></div>`).join("")}
        ${a.flags.map(f => `<div class="kv dim"><span class="k">note</span><span class="v">${esc(f)}</span></div>`).join("")}
        ${ans ? `<div class="ansblock">
            ${ans.speech ? `<div class="speech">“${esc(ans.speech)}”</div>` : ""}
            ${ans.action ? `<div class="action">${esc(ans.action)}</div>` : ""}
            ${ans.thought ? `<div class="thought">${esc(ans.thought)}</div>` : ""}
            ${ans.note ? `<div class="thought">note: ${esc(ans.note)}</div>` : ""}
            <div class="skills">${(ans.skills_used||[]).map(s =>
              (ans.unverified||[]).includes(s) ? `<span class="bad">${esc(s)}✗</span>` : esc(s)).join(" · ") || "no skills listed"}</div>
          </div>` : ""}
        ${a.judge ? `<div class="verdict ${a.judge.verdict}">${a.judge.verdict}${a.judge.note ? " — " + esc(a.judge.note) : ""}</div>` : ""}
      </div>`;
    }).join("");

    return `<details class="consult" data-seq="${b.seq}"${isOpen ? " open" : ""}>
      <summary><span class="who">${esc(b.who)}</span><span class="qs">${esc(q)}</span>${tags}</summary>
      <div class="body">${attempts}</div>
    </details>`;
  }

  function renderReader(b) {
    if (b.answer !== null) {
      return `<div class="reader answered">
        <div class="rlabel">you were asked</div>
        <div class="rframing">${esc(b.framing)}</div>
        <div class="rchosen">chose: <b>${esc(b.answer)}</b></div>
      </div>`;
    }
    const opts = b.options.map((o, i) =>
      `<button class="btn readerOpt" data-seq="${b.seq}" data-i="${i}">${esc(o)}</button>`).join("");
    return `<div class="reader pending" data-seq="${b.seq}">
      <div class="rlabel">the writer wants your call</div>
      <div class="rframing">${esc(b.framing)}</div>
      <div class="btns">${opts}</div>
      <div class="field"><textarea class="readerOwn" data-seq="${b.seq}" rows="2"
                placeholder="or write your own"></textarea></div>
      <div class="btns"><button class="btn primary readerSend" data-seq="${b.seq}">send</button></div>
    </div>`;
  }

  function wireReader(page) {
    for (const b of page.querySelectorAll(".readerOpt"))
      b.addEventListener("click", () => sendReaderAnswer(b.textContent));
    for (const b of page.querySelectorAll(".readerSend"))
      b.addEventListener("click", () => {
        const ta = page.querySelector(`.readerOwn[data-seq="${b.dataset.seq}"]`);
        const text = (ta?.value || "").trim();
        if (text) sendReaderAnswer(text);
      });
  }
  async function sendReaderAnswer(answer) {
    try {
      await fetch("/reader-answer", { method:"POST", headers:{ "Content-Type":"application/json" },
                                      body: JSON.stringify({ answer }) });
    } catch {}
  }

  // ---- the picker ---------------------------------------------------------
  // Shown while the session is parked waiting for a story, and rendered ABOVE the prose rather than
  // instead of it: a scene that has just finished must not be shoved off the page by the question of
  // what to write next.
  function pickerHtml() {
    if (!stories) return `<section class="picker"><h2>Choose a story</h2>
      <p class="sub">reading the shelf…</p></section>`;

    const cast = s => (s.characters || []).map(c => {
      const bits = [];
      if (c.can?.length) bits.push(`<span class="yes">+${esc(c.can.join(", "))}</span>`);
      if (c.cannot?.length) bits.push(`<span class="no">no ${esc(c.cannot.join(", "))}</span>`);
      return `<span class="chip"><b>${esc(c.name)}</b>${bits.length ? " " + bits.join(" ") : ""}</span>`;
    }).join("");

    const cards = stories.map(s => {
      // A story that does not load says so here, and cannot be chosen — the same pre-flight the CLI
      // runs, so the card cannot disagree with what a run would do.
      const dead = !s.ok || !!picked;
      return `<button class="card" data-dir="${esc(s.dir)}"${dead ? " disabled" : ""}>
        <div class="name">${esc(s.name)}</div>
        ${s.ok ? `<p class="q">${esc(s.scene?.question || "(no scene question)")}</p>
                  <p class="pre">${esc(s.premise || "")}</p>
                  <div class="row">${cast(s)}<span class="meta">~${s.scene?.length ?? "?"} words
                    · ${s.maxSteps ?? "?"} steps${s.scene?.pov ? " · pov " + esc(s.scene.pov) : ""}</span></div>`
                : `<div class="bad">does not load — ${esc(s.error || "unknown error")}</div>`}
        ${(s.warnings || []).map(w => `<div class="warn">⚠ ${esc(w)}</div>`).join("")}
      </button>`;
    }).join("");

    // A finished scene stays on the page under the picker — §1's principle. But it has to be
    // dismissible, or the only way back to a clean shelf is a reload, and a reload brings it back.
    const clear = events.length
      ? ` · <a href="#" id="clear-scene" style="color:var(--accent)">clear the last scene</a>` : "";
    return `<section class="picker">
      <h2>Choose a story</h2>
      <p class="sub">${picked ? "starting…" : "the run begins as soon as you pick one"}${clear}</p>
      <div class="cards">${cards}
        <button class="card new" data-new="1"${picked ? " disabled" : ""}>
          <div class="name">new story…</div>
          <p class="q">describe an idea and have one built — the interview is still at the console</p>
        </button>
      </div>
    </section>`;
  }

  async function choose(payload) {
    if (picked) return;                       // a double-click is one choice, not two
    picked = payload.new ? "new" : payload.dir;
    render();
    try {
      const r = await fetch("/select", { method:"POST", headers:{ "Content-Type":"application/json" },
                                         body: JSON.stringify(payload) });
      if (!(await r.json()).ok) { picked = ""; render(); }
    } catch { picked = ""; render(); }
  }

  function wirePicker(page) {
    for (const b of page.querySelectorAll(".card[data-dir]"))
      b.addEventListener("click", () => choose({ dir: b.dataset.dir }));
    for (const b of page.querySelectorAll(".card[data-new]"))
      b.addEventListener("click", () => { ideaOpen = true; render(); });
    const clear = page.querySelector("#clear-scene");
    if (clear) clear.addEventListener("click", e => {
      e.preventDefault();
      // The VIEW only. The run's log stays on disk and at /log.jsonl, because that is the record and
      // this is a reading pane.
      events = []; seen = new Set(); meta = null; composing = null; open.clear();
      $("cast").innerHTML = ""; $("question").textContent = ""; $("title").textContent = "story-writer";
      render();
    });
  }

  // ---- the interview ------------------------------------------------------
  // SPEC-S §4 in the browser. Conversation only: every change is a patch through the architect, the
  // same round the console sends, because both drive one ScaffoldSession. Nothing here decides
  // anything — it shows what the session decided and sends back what you said.
  const fld = (id, label, value, rows, disabled) =>
    `<div class="field"><label for="${id}">${label}</label>
      <textarea id="${id}" ${disabled ? "disabled" : ""} rows="${rows}"
                placeholder="">${esc(value)}</textarea></div>`;

  function castHtml(spec) {
    return spec.characters.map(c => {
      const can = c.skills.map(s => esc(s.text) + (s.meaning ? ` <span style="color:var(--faint)">— ${esc(s.meaning)}</span>` : "")).join(", ");
      return `<div class="who">
        <div class="nm">${esc(c.name)}</div>
        ${can ? `<div class="line"><span class="k yes">can also</span>${can}</div>` : ""}
        ${c.lacks.length ? `<div class="line"><span class="k no">cannot</span>${esc(c.lacks.join(", "))}</div>` : ""}
        ${c.knows ? `<div class="line"><span class="k">knows</span>${esc(c.knows)}</div>` : ""}
        <div class="persona${personasFull ? "" : " clip"}">${esc(c.persona)}</div>
      </div>`;
    }).join("");
  }

  function proposalHtml(spec) {
    const bits = [spec.scene.place, `~${spec.scene.length} words`, spec.scene.pov ? `pov ${spec.scene.pov}` : ""]
      .filter(Boolean).map(esc).join(" · ");
    return `<div class="proposal">
      <h3>${esc(spec.title || "(untitled)")}</h3>
      <div class="where">${bits}</div>
      <p class="premise">${esc(spec.premise || "(no premise)")}</p>
      <p class="q"><b>the question this scene answers</b>${esc(spec.scene.question || "(none)")}</p>
      ${castHtml(spec)}
      ${spec.writerStyle && personasFull
        ? `<div class="who"><div class="nm">house style</div><div class="persona">${esc(spec.writerStyle)}</div></div>` : ""}
    </div>`;
  }

  /** What the last round did, said plainly. Mirrors showRound() at the console. */
  function lastHtml(last) {
    if (!last) return "";
    if (last.kind === "failed")  return `<div class="said bad">that round failed (${esc(last.error)}) — nothing changed</div>`;
    if (last.kind === "nothing") return `<div class="said bad">it didn't come back with a story — try saying who is in the scene and what is at stake</div>`;
    if (last.kind === "edits") {
      const changed = last.applied.length ? `changed: ${esc(last.applied.join(", "))}` : "it changed nothing";
      const ig = last.ignored.map(x => `<div class="said bad">ignored ${esc(x)}</div>`).join("");
      return `<div class="said good">${changed}</div>${ig}`;
    }
    if (last.kind === "proposal" && last.note) return `<div class="said">note: ${esc(last.note)}</div>`;
    return "";
  }

  function interviewHtml() {
    const s = scaffold;
    // Not started: just the idea box.
    if (!s.active) {
      return `<section class="picker iv">
        <h2>A new story</h2>
        <p class="sub">as much or as little as you like — it will ask if it needs more</p>
        ${fld("f-idea", "the idea", draft.idea, 4, false)}
        <div class="btns"><button class="btn primary" id="iv-start">propose a story</button>
          <button class="btn" id="iv-back">back to the shelf</button></div>
      </section>`;
    }

    const busy = !!s.busy;
    const answering = !!s.pendingAsk;
    const body = [];

    if (s.spec) body.push(proposalHtml(s.spec));
    body.push(lastHtml(s.last));
    for (const p of (s.problems || [])) body.push(`<div class="prob">⚠ ${esc(p)}</div>`);
    if (answering) body.push(`<div class="asked"><span class="k">it needs to know</span>${esc(s.pendingAsk)}</div>`);

    if (busy) body.push(`<div class="thinking"><i></i>thinking about it…</div>`);

    if (s.needsFolder) {
      // Never overwrite an authored story, and never invent a name the title does not give.
      body.push(`<div class="asked"><span class="k">where should it go</span>${esc(s.needsFolder)}</div>
        <div class="field"><label for="f-folder">folder name</label>
          <input type="text" id="f-folder" value="${esc(draft.folder)}"></div>
        <div class="btns"><button class="btn primary" id="iv-folder">write it there</button></div>`);
    } else if (!busy) {
      body.push(fld("f-say", answering ? "your answer" : s.haveStory ? "what should change?" : "say more about it",
                    draft.say, 3, false));
      const acceptable = s.haveStory;
      body.push(`<div class="btns">
        ${acceptable ? `<button class="btn primary${acceptArmed ? " armed" : ""}" id="iv-accept">${
          acceptArmed ? `accept over ${s.problems.length} flag(s)` : "accept & write it"}</button>` : ""}
        <button class="btn" id="iv-say">send</button>
        ${s.spec ? `<button class="btn" id="iv-full">${personasFull ? "shorter" : "personas in full"}</button>` : ""}
        <button class="btn" id="iv-abandon">abandon</button>
      </div>`);
    }

    return `<section class="picker iv">
      <h2>${s.haveStory ? "Does this look right?" : "A new story"}</h2>
      <p class="sub">${esc(s.idea)}</p>
      ${body.join("")}
    </section>`;
  }

  async function postScaffold(what, payload) {
    try {
      const r = await fetch(`/scaffold/${what}`, { method:"POST", headers:{ "Content-Type":"application/json" },
                                                   body: JSON.stringify(payload || {}) });
      const j = await r.json();
      if (j && j.active !== undefined) { scaffold = j; render(); }
      return j;
    } catch { return null; }
  }

  const disarmAccept = () => { clearTimeout(acceptArmed); acceptArmed = 0; render(); };

  function wireInterview(page) {
    const on = (id, fn) => { const el = page.querySelector("#" + id); if (el) el.addEventListener("click", fn); };
    // Keep what is being typed across the re-renders that SSE frames cause.
    for (const [id, key] of [["f-idea","idea"], ["f-say","say"], ["f-folder","folder"]]) {
      const el = page.querySelector("#" + id);
      if (el) el.addEventListener("input", () => { draft[key] = el.value; });
    }
    on("iv-back", () => { ideaOpen = false; render(); });
    on("iv-start", async () => {
      if (!draft.idea.trim()) return;
      scaffold = { active:true, busy:true, idea:draft.idea.trim(), problems:[], haveStory:false };
      render();
      await postScaffold("start", { idea: draft.idea.trim() });
    });
    on("iv-say", async () => {
      const text = draft.say.trim(); if (!text) return;
      draft.say = "";
      await postScaffold("say", { text });
    });
    on("iv-full", () => { personasFull = !personasFull; render(); });
    on("iv-abandon", async () => {
      await postScaffold("abandon", {});
      scaffold = { active:false }; ideaOpen = false; draft.idea = draft.say = draft.folder = "";
      render();
    });
    on("iv-folder", async () => {
      const folder = draft.folder.trim(); if (!folder) return;
      await postScaffold("accept", { folder });
    });
    on("iv-accept", async () => {
      // Accepting over a complaint is allowed — they are judgements about the design, not errors —
      // but it takes a deliberate second click, as it takes a second keypress at the console.
      if (scaffold.problems && scaffold.problems.length && !acceptArmed) {
        acceptArmed = setTimeout(disarmAccept, 5000); render(); return;
      }
      clearTimeout(acceptArmed); acceptArmed = 0;
      await postScaffold("accept", {});
    });
  }

  /** Give focus back to whatever field had it when the render began, caret at the end. */
  function restoreFocus(page, id) {
    if (!id) return;
    const el = page.querySelector("#" + id);
    if (!el || el.disabled) return;
    el.focus();
    try { el.setSelectionRange(el.value.length, el.value.length); } catch {}
  }

  function render() {
    const blocks = build();
    const page = $("page");
    const active = document.activeElement;
    const keepFocus = active && FIELDS.test(active.id || "") ? active.id : "";
    // The interview and the picker are the same question — what do we write next — so they share
    // one slot at the top of the reading column, above whatever scene is already there.
    const chrome = (scaffold.active || ideaOpen) ? interviewHtml()
                 : session.picking ? pickerHtml() : "";
    if (!blocks.length) {
      page.innerHTML = chrome || `<div class="empty"><h2>Nothing loaded yet</h2>
        <p>Run the engine with <code>--serve</code> to watch a scene as it is written, or drop a
        saved <code>out/writing-log.jsonl</code> onto this page.</p></div>`;
      $("rail").innerHTML = "";
      wirePicker(page); wireInterview(page); restoreFocus(page, keepFocus);
      return;
    }
    page.innerHTML = chrome + `<div class="prose">` + blocks.map(b => {
      if (b.kind === "prose") return `<div class="piece${b.salvaged ? " salvaged" : ""}">${
        b.salvaged ? `<div class="salvnote">recovered from a truncated draft</div>` : ""}${paras(b.text)}</div>`;
      if (b.kind === "consult") return renderConsult(b);
      if (b.kind === "reader") return renderReader(b);
      if (b.kind === "note") return `<div class="note">${esc(b.text)}</div>`;
      if (b.kind === "end") return `<div class="note end">${
        b.stopped ? "stopped by request" : b.done ? "scene finished" : "stopped early"}
        · ${b.words} words · ${b.steps} steps</div>`;
      return "";
    }).join("") + `</div>`;

    for (const d of page.querySelectorAll("details.consult")) {
      d.addEventListener("toggle", () => {
        const s = Number(d.dataset.seq);
        d.open ? open.add(s) : open.delete(s);
      });
    }
    wirePicker(page); wireInterview(page); wireReader(page); restoreFocus(page, keepFocus);
    renderRail(blocks);
  }

  function renderRail(blocks) {
    const words = events.filter(e => e.t === "draft").reduce((n, e) => Math.max(n, e.words || 0), 0);
    const target = meta?.target || 0;
    const consults = blocks.filter(b => b.kind === "consult");
    const count = t => events.filter(e => e.t === t).length;
    const pct = target ? Math.min(100, Math.round(words / target * 100)) : 0;
    const stat = (k, v, cls) => `<div class="stat"><span>${k}</span><span class="n ${cls||""}">${v}</span></div>`;
    const flags = count("skill_flag"), retries = count("retry");
    $("rail").innerHTML = `
      <h3>progress</h3>
      <div class="bar"><i style="width:${pct}%"></i></div>
      ${stat("words", target ? `${words} / ${target}` : words)}
      ${stat("steps", count("draft"))}
      ${stat("consults", consults.length)}
      ${stat("asked back", count("clarify"))}
      ${stat("retries", retries, retries ? "warn" : "")}
      ${stat("skill flags", flags, flags ? "bad" : "")}
      ${composing ? `<div class="composing"><i></i><span class="who">${esc(composing.who)}</span>
         composing… ${composing.secs}s</div>` : ""}`;
  }

  function renderHeader() {
    if (!meta) return;
    $("title").textContent = (meta.story || "").replace(/^.*[\\/]/, "") || "story-writer";
    $("question").textContent = meta.question || "";
    $("cast").innerHTML = (meta.characters || []).map(c => {
      const bits = [];
      if (c.skills?.length) bits.push(`<span class="yes">+${c.skills.join(", ")}</span>`);
      if (c.lacks?.length)  bits.push(`<span class="no">no ${c.lacks.join(", ")}</span>`);
      return `<span class="chip"><b>${esc(c.name)}</b>${bits.length ? " " + bits.join(" ") : ""}</span>`;
    }).join("");
  }

  // ---- sources ------------------------------------------------------------
  const setSrc = (text, live) => { $("src").textContent = text; $("dot").className = "dot" + (live ? " live" : ""); };

  // ---- the session (live only) --------------------------------------------
  // Whether a scene is being written RIGHT NOW is a different question from what the events say: a
  // saved log and a run that stopped ten seconds ago contain exactly the same thing. So the engine
  // reports it separately, over `run_state` and `GET /run`, and it never reaches the log.
  function renderSession() {
    const b = $("stop");
    b.disabled = !session.running || session.stopping;
    b.classList.toggle("armed", !!armed);
    b.textContent = session.stopping ? "stopping…" : armed ? "confirm stop" : "stop run";
    $("where").textContent = session.where ? "· " + session.where : "";
    const cm = $("consultMe");
    cm.disabled = !session.running || session.stopping || session.armed;
    cm.textContent = session.armed ? "consulting…" : "consult me";
  }
  const disarm = () => { clearTimeout(armed); armed = 0; renderSession(); };

  /** Fetch the shelf when the session starts waiting on a choice, and drop it when it stops — the
   *  pre-flight behind it goes stale the moment a story is edited on disk. */
  async function loadStories() {
    if (!session.picking) { stories = null; picked = ""; return; }
    stories = null;
    try { stories = (await (await fetch("/stories")).json()).stories || []; }
    catch { stories = []; }
    render();
  }
  $("stop").onclick = async () => {
    if (!session.running || session.stopping) return;
    // Ending a scene part-written is deliberate, so it takes a second click — the same reason the
    // scaffolder makes you confirm an accept over an outstanding complaint.
    if (!armed) { armed = setTimeout(disarm, 4000); renderSession(); return; }
    clearTimeout(armed); armed = 0;
    session.stopping = true; renderSession();
    try { await fetch("/stop", { method:"POST" }); } catch {}
  };
  $("consultMe").onclick = async () => {
    if (!session.running || session.stopping || session.armed) return;
    try { await fetch("/consult-me", { method:"POST" }); } catch {}
  };

  function ingest(text) {
    events = text.split("\n").filter(Boolean).map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
    seen = new Set(events.map(e => e.seq).filter(s => s !== undefined));
    renderHeader(); render();
  }

  async function tryHttp() {
    try {
      const r = await fetch("/run"); if (!r.ok) throw 0;
      const j = await r.json();
      if (j.run) { meta = j.run; renderHeader(); }
      session = { running: !!j.running, stopping: !!j.stopping, where: j.where || "", picking: !!j.picking, armed: !!j.armed };
      if (j.awaitingContinue) showPrompt(j.awaitingContinue);
      if (j.picking) loadStories();          // a reload while the session waits must not strand it
      // An interview may already be open — a reload in the middle of one must land back in it.
      try { scaffold = await (await fetch("/scaffold")).json(); } catch {}
      render();                              // a session with nothing written yet still has a page
      startSSE();
      return true;
    } catch { return false; }
  }

  function startSSE() {
    const es = new EventSource("/events");
    setSrc("live", true);
    $("stop").hidden = false;          // the run can only be stopped where there is one to stop
    $("consultMe").hidden = false;
    renderSession();
    let pending = null;
    es.onmessage = m => {
      let f; try { f = JSON.parse(m.data); } catch { return; }
      if (f.t === "composing") { composing = f; renderRail(build()); return; }
      if (f.t === "idle") { composing = null; renderRail(build()); return; }
      if (f.t === "continue_prompt") { showPrompt(f); return; }
      if (f.t === "run_state") {
        const was = session.picking;
        session = { running: !!f.running, stopping: !!f.stopping, where: f.where || "", picking: !!f.picking, armed: !!f.armed };
        if (!session.running) disarm();
        if (session.picking !== was) loadStories();
        renderSession();
        // Always, not only on the picking edge: a frame arrives at most a few times per run, and
        // rendering on every one costs nothing next to being one missed transition away from a page
        // with no way back to the shelf.
        render();
        return;
      }
      if (f.t === "scaffold") {
        // A round is a minute of model call; a reload or a second tab has to be able to catch up,
        // and the POST response only ever reaches whoever sent it.
        scaffold = f.state || { active:false };
        if (scaffold.active) ideaOpen = false;
        if (!scaffold.problems || !scaffold.problems.length) disarmAccept(); else render();
        return;
      }
      if (f.t === "run_reset") {
        // A new story in the same session. Replay only helps clients that connect after it; one
        // already attached has to be told, or the next scene renders glued onto the last one.
        events = []; seen = new Set(); meta = null; composing = null; open.clear();
        $("cast").innerHTML = ""; $("question").textContent = "";
        fetch("/run").then(r => r.json()).then(j => { if (j.run) { meta = j.run; renderHeader(); } }).catch(() => {});
        render();
        return;
      }
      // A replayed event is one we already have. `seq` is stamped once by publish(), so it is the
      // identity of the event in both the log and the stream.
      if (f.seq !== undefined) { if (seen.has(f.seq)) return; seen.add(f.seq); }
      events.push(f);
      // Re-render whole, debounced: a scene is a few dozen events, and rebuilding is far cheaper
      // than keeping incremental DOM state correct across retries and late-arriving verdicts.
      //
      // A TIMER, not requestAnimationFrame. rAF does not fire in a hidden or non-compositing tab, so
      // a run watched in a background tab stopped updating entirely — and because the handle latched
      // in `pending`, nothing rescheduled either. A scene is a few dozen events; frame alignment was
      // never worth that.
      if (!pending) pending = setTimeout(() => {
        pending = null;
        const nearBottom = window.scrollY + innerHeight > document.body.scrollHeight - 220;
        if (!meta) renderHeader();
        render();
        if (nearBottom) window.scrollTo(0, document.body.scrollHeight);
      });
    };
    es.onerror = () => setSrc("live (reconnecting…)", false);
  }

  // ---- the out-of-budget prompt (live only) -------------------------------
  function showPrompt(p) {
    $("promptText").textContent = `${p.steps} steps used and the scene is not finished.`;
    $("promptN").value = p.suggested || 8;
    $("prompt").classList.add("on");
  }
  const answerPrompt = async n => {
    $("prompt").classList.remove("on");
    try { await fetch("/continue", { method:"POST", headers:{ "Content-Type":"application/json" },
                                     body: JSON.stringify({ steps:n }) }); } catch {}
  };
  $("promptGo").onclick = () => answerPrompt(Math.max(0, parseInt($("promptN").value, 10) || 0));
  $("promptStop").onclick = () => answerPrompt(0);

  // ---- chrome -------------------------------------------------------------
  $("expand").onclick = () => {
    expandAll = !expandAll;
    $("expand").textContent = expandAll ? "collapse all" : "expand all";
    if (!expandAll) open.clear();
    render();
  };
  $("theme").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  };
  $("load").onclick = () => $("file").click();
  $("file").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    f.text().then(t => { setSrc(f.name, false); ingest(t); });
  };
  addEventListener("dragover", e => { e.preventDefault(); $("drop").classList.add("on"); });
  addEventListener("dragleave", e => { if (e.relatedTarget === null) $("drop").classList.remove("on"); });
  addEventListener("drop", e => {
    e.preventDefault(); $("drop").classList.remove("on");
    const f = e.dataTransfer.files[0]; if (!f) return;
    f.text().then(t => { setSrc(f.name, false); ingest(t); });
  });

  // ---- boot ---------------------------------------------------------------
  (async () => {
    const src = new URLSearchParams(location.search).get("src");
    if (src) {
      try { const r = await fetch(src); setSrc(src, false); ingest(await r.text()); return; } catch {}
    }
    if (location.protocol.startsWith("http")) {
      if (await tryHttp()) return;
      try { const r = await fetch("/log.jsonl"); if (r.ok) { setSrc("/log.jsonl", false); ingest(await r.text()); return; } } catch {}
    }
    render();
  })();
})();
</script>
