<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>story-writer — run viewer</title>
<!--
  Renderer for the story-writer engine (see ../GUI-SPEC.md). A run is shown PROSE FIRST: the scene
  reads straight down the page, and every consult that produced it sits collapsed between the
  paragraphs it came between. Open one to see exactly what that character was told, what it asked
  back, what it answered, and whether the writer took it.

  Three pages, one flat file, no router but a hash for each (see ../VIEWER-UI.md#pages-and-navigation):
    • story        (#/shelf) — choosing what gets written next. Shown only while the session is
                                actually parked waiting for a pick.
    • run          (#/live)  — the live (or just-finished) scene, streamed from /events. Late
                                joiners get the whole run replayed, then live.
    • saved runs   (#/read)  — a story's retained runs, or a dropped/opened writing-log.jsonl.
                                Never touches the live scene's own copy of the data.

  Navigation locks to the run page while a scene is actively generating, so leaving it always means
  a deliberate pause or stop first, never an accidental page flip mid-sentence.

  Dependency-free, no build step. Everything below is one file on purpose.
-->
<link rel="stylesheet" type="text/css" href="viewer.css">

<!-- Before anything paints, or a kept theme arrives as a flash of the other one. -->
<script>try { const t = localStorage.getItem("sw-theme");
  if (t) document.documentElement.setAttribute("data-theme", t); } catch {}</script>

<div class="topbar">
  <div class="brand"><h1 id="title">story-writer</h1><div class="q" id="question"></div></div>
  <nav class="tabs" id="tabs">
    <button class="tab" id="tab-shelf" data-view="shelf" hidden>story</button>
    <button class="tab" id="tab-live" data-view="live" hidden>run<span class="tabdot" id="tabdot" hidden></span></button>
    <button class="tab" id="tab-read" data-view="read" hidden>saved runs</button>
  </nav>
  <div class="cast" id="cast"></div>
  <select class="btn" id="modelSelect" hidden><option value="">story default</option></select>
  <button class="btn" id="interactive" hidden>interactive</button>
  <button class="btn" id="pause" hidden>pause</button>
  <button class="btn" id="consultMe" hidden>consult me</button>
  <button class="btn" id="stop" hidden>stop run</button>
  <button class="btn" id="expand">expand all</button>
  <button class="btn" id="theme">theme</button>
</div>
<div class="ribbon" id="ribbon" hidden></div>
<div class="srcbar"><span class="dot" id="dot"></span><span id="src">nothing loaded</span><span id="where"></span>
  <span id="notice"></span></div>

<div class="layout">
  <main class="page" id="page"></main>
  <aside class="rail" id="rail"></aside>
</div>

<div class="drop" id="drop">drop a writing-log.jsonl</div>
<div class="prompt" id="prompt">
  <span id="promptText">The step budget is spent.</span>
  <input id="promptN" type="number" min="0" value="8">
  <button class="btn" id="promptGo">give steps</button>
  <button class="btn" id="promptStop">stop</button>
</div>
<input type="file" id="file" accept=".jsonl,.json,.txt" style="display:none">

<script type="module" src="viewer.js"></script>
